[package]
name = "rme-formats"
description = "Readers for the game data of Tony Hawk's SHRED (PS3): PAK archives, level meshes, materials, textures, MAIN.DB and level scripts"
keywords = ["ps3", "tony-hawk", "pak", "game-formats", "modding"]
categories = ["parser-implementations", "game-development"]
readme = "README.md"
documentation = "https://docs.rs/rme-formats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
primase-foundations = { workspace = true, features = ["compress"] }
rsx-reader.workspace = true
morpheme-formats.workspace = true
lua51-bytecode.workspace = true
quantydb-sqlite.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
half.workspace = true

[dev-dependencies]
primase-testdata.workspace = true
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true

[workspace]


[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/Kalmarv/rme-formats"
publish = true

[workspace.dependencies]
half = { version = "=2.7.1", default-features = false }
lua51-bytecode = { version = "0.2.0", git = "https://github.com/Kalmarv/lua51-bytecode", rev = "cfa3a7001c3f8d240a2360b7598609d420d99243" }
morpheme-formats = { version = "0.1.1", git = "https://github.com/Kalmarv/morpheme-formats", rev = "40467a65f41d052534d90c18d980ef3329967de7" }
primase-foundations = { version = "0.3.0", git = "https://github.com/Kalmarv/primase-foundations", rev = "f9cf4ece1de77fce9d703c63347dd70b728b7c0e" }
primase-testdata = { version = "0.1.2", git = "https://github.com/Kalmarv/primase-testdata", rev = "4fce41eecd06019bc44310de919313119cda4c34" }
quantydb-sqlite = { version = "=0.4.0", default-features = false }
rsx-reader = { version = "0.4.0", git = "https://github.com/Kalmarv/dx", rev = "c32a3689c6bd26a0ee0777664091f4e04843927e" }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "preserve_order", "float_roundtrip"] }
sha2 = { version = "=0.11.1", default-features = false }
thiserror = { version = "=2.0.21", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
float_cmp = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
iter_over_hash_type = "deny"
disallowed_methods = "allow"
disallowed_types = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test]
opt-level = 1
