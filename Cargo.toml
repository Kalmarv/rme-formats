[package]
name = "rme-formats"
description = "Readers for the game data of Tony Hawk's SHRED (PS3): PAK archives, level meshes, materials, textures, MAIN.DB and level scripts"
keywords = ["ps3", "tony-hawk", "pak", "game-formats", "modding"]
categories = ["parser-implementations", "game-development"]
readme = "README.md"
documentation = "https://docs.rs/rme-formats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
primase-foundations = { workspace = true, features = ["compress"] }
rsx-reader.workspace = true
morpheme-formats.workspace = true
lua51-bytecode.workspace = true
quantydb-sqlite.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
half.workspace = true

[dev-dependencies]
primase-testdata.workspace = true
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true

[workspace]


[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/Kalmarv/rme-formats"
publish = false

[workspace.dependencies]
half = { version = "=2.7.1", default-features = false }
lua51-bytecode = { git = "https://github.com/Kalmarv/lua51-bytecode", rev = "6f69e17dfd5b4413dc04c0862acdce5b4f21582a" }
morpheme-formats = { git = "https://github.com/Kalmarv/morpheme-formats", rev = "ccd6cde9b7614d2927403991f834ab0dc8fb6cc9" }
primase-foundations = { git = "https://github.com/Kalmarv/primase-foundations", rev = "8dd2fb8caa84eb22b6998655550f1cf288ca6b93" }
primase-testdata = { git = "https://github.com/Kalmarv/primase-testdata", rev = "3d70d5ce04d0335b41d359fbfc7d6d5a714b581d" }
quantydb-sqlite = { version = "=0.4.0", default-features = false }
rsx-reader = { git = "https://github.com/Kalmarv/dx", rev = "cfb08239b8bb177d65a44cdd182cbfebd942dd93" }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "preserve_order", "float_roundtrip"] }
sha2 = { version = "=0.11.1", default-features = false }
thiserror = { version = "=2.0.21", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
float_cmp = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
iter_over_hash_type = "deny"
disallowed_methods = "allow"
disallowed_types = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test]
opt-level = 1
